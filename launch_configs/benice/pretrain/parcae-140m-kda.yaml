run_name: parcae-140m-kda
resume: False
max_tokens: 11_200_000_000
seed: 42
out_dir: "outputs/parcae-140m-kda"
model_name: parcae-small-140m
model_impl: dynamic
block_size: 2048

# Eval at different recurrence depths (8 is added automatically as mean_recurrence)
partial_depth_eval: [1, 2, 4]

model_overwrite:
  vocab_size: 32768
  prelude_norm: true
  use_fused_head: liger
  attention_class_name: KDACausalSelfAttention
  qk_norm: false
  kda_mode: chunk
  kda_impl: fla-chunk
  kda_head_dim: 128
  kda_num_v_heads: 6
  kda_expand_v: 1
  kda_use_short_conv: true
  kda_allow_neg_eigval: false
  kda_safe_gate: true
  kda_lower_bound: -5
  kda_disable_recompute: false
  kda_conv_size: 4
  kda_conv_bias: false

world_batch_size: 256
micro_batch_size: 32

optimizer: MuonAdamW
optim_config:
  lr: 2e-2
  weight_decay: 0.1
  betas: [0.8, 0.95]
  eps: 1e-10
  muon_lr: 2e-2
  muon_momentum: 0.95
  muon_wd: 0.3         # Muon weight decay (cautious, linearly decays to 0)
  muon_ns_steps: 5

warmup_steps: 0.0
cooldown_steps: 0.5
lr_schedule: trapezoid
min_lr: 0
grad_clip: 1.0
no_weight_decay_for_bias_and_norm_params: True

z_regularization: 0
label_smoothing: 0

fabric_strategy: ddp
fabric_precision: bf16-mixed
fabric:
  optim_sharding: False

compile_model: True
gradient_checkpointing: False

loss_guardrail_active: True
skip_nonfinite_grads: True
allow_nonfinite_loss: False

logger_project: "parcae"
model_telemetry: True
log_step_interval: 1
save_step_interval: 1024
eval_step_interval: 512
eval_iters: 16
save_last_step: True

all_block_size_tensors: False
pack_sequences: True

data_config:
  train_data:
    - type: pqds-pure
      prefix: ""
      weight: 1
      data_dir: "/resource/data/climbmix-shuffle/400b"
      data_signature:
        keys: ["text"]
  val_data:
    - type: pqds-pure
      prefix: ""
      weight: 1
      data_dir: "/resource/data/climbmix-shuffle/val"
      data_signature:
        keys: ["text"]

tokenizer_path: "SandyResearch/parcae-climbmix-tokenizer"
